services:
  meet-vale:
    build: .
    environment:
      MEET_OWNER_KEY: ${MEET_OWNER_KEY:?Set a random owner key in .env}
    ports:
      - "127.0.0.1:8102:8102"
    volumes:
      - meet-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  meet-data:
